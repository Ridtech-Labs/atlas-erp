services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas-erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: atlas-erp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17
    container_name: atlas-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_erp
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atlas-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --queue=emails,notifications,reports,imports,exports,default --tries=3 --sleep=1
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/scheduler.conf"]
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/supervisor/scheduler.conf:/etc/supervisor/conf.d/scheduler.conf:ro
    depends_on:
      - app

  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas-erp-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
