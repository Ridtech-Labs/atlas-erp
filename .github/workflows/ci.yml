name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite, pdo_sqlite, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy testing environment
        run: cp .env.testing.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run Pest
        run: php artisan test

  postgres-compatibility:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_erp_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy application environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: atlas_erp_test
          DB_USERNAME: atlas
          DB_PASSWORD: secret
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: file
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --force

      - name: Run PostgreSQL seeders
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: atlas_erp_test
          DB_USERNAME: atlas
          DB_PASSWORD: secret
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: file
          REDIS_HOST: 127.0.0.1
        run: php artisan db:seed --force
